<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pusula Ops</title>
<style>
:root{--bg:#07080c;--ink:#e8edf6;--dim:#8a93a6;--line:#262b38;--card:#10131a;--cyan:#6ee0ff;--ok:#5ee9b5;--bad:#ff6b81}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif}
header,main{max-width:800px;margin:0 auto;padding:16px}
.brand{font:700 13px ui-monospace,monospace;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}
.sub,.note{color:var(--dim);font-size:13px;line-height:1.5}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs button{border:1px solid var(--line);background:#141821;color:var(--ink);border-radius:999px;padding:8px 12px}
.tabs button.on{border-color:var(--cyan);color:var(--cyan)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:8px 0 4px}
select,input{width:100%;background:#0b0e14;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi b{display:block;font-size:18px;margin-top:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}a{color:var(--cyan)}.hide{display:none}
</style></head><body>
<header>
<div class="brand">Pusula Ops</div>
<p class="sub">Second app. Serve asks if it stands. This page asks what standing costs and whether the endpoint is burning the month. <a href="/">Serve</a></p>
<div class="tabs">
<button type="button" class="on" data-t="bill">Bill</button>
<button type="button" data-t="slo">SLO</button>
<button type="button" data-t="route">Route</button>
</div>
</header>
<main>
<section id="p-bill">
<div class="card">
<label>Box</label>
<select id="box">
<option value="3.2">H100 ~$3.2/hr</option>
<option value="3.8">H200 ~$3.8/hr</option>
<option value="0.7">RTX 5090 ~$0.7/hr</option>
<option value="1.1">Spark own ~$1.1/hr</option>
</select>
<div class="g">
<div><label>GPU count</label><input id="n" type="number" value="4" min="1"/></div>
<div><label>Hours / month</label><input id="hrs" type="number" value="720"/></div>
<div><label>Useful tok/s</label><input id="tps" type="number" value="80"/></div>
<div><label>Idle fraction</label><input id="idle" type="number" value="0.35" step="0.05" min="0" max="0.95"/></div>
</div>
</div>
<div class="card">
<div class="kpi">
<div><label>Box / month</label><b id="m-box">—</b></div>
<div><label>Useful M tok</label><b id="m-tok">—</b></div>
<div><label>$ / M useful</label><b id="m-unit">—</b></div>
<div><label>Idle tax</label><b id="m-idle">—</b></div>
</div>
<p class="note" id="billCut"></p>
</div>
</section>
<section id="p-slo" class="hide">
<div class="card">
<div class="g">
<div><label>Availability target %</label><input id="slo" type="number" value="99.9" step="0.01"/></div>
<div><label>Month minutes</label><input id="min" type="number" value="43200"/></div>
<div><label>5xx minutes</label><input id="down" type="number" value="80"/></div>
<div><label>TTFT p99 ms</label><input id="ttft" type="number" value="2400"/></div>
<div><label>TTFT budget ms</label><input id="ttftb" type="number" value="800"/></div>
<div><label>Bad TTFT share %</label><input id="badp" type="number" value="12"/></div>
</div>
</div>
<div class="card">
<div class="kpi">
<div><label>Error budget min</label><b id="eb">—</b></div>
<div><label>Budget left</label><b id="left">—</b></div>
<div><label>Avail now</label><b id="av">—</b></div>
<div><label>TTFT</label><b id="tf">—</b></div>
</div>
<p class="note" id="sloCut"></p>
</div>
</section>
<section id="p-route" class="hide">
<div class="card">
<label>What hits the box</label>
<select id="kind">
<option value="infer">70B / long ctx inference</option>
<option value="agent">tool loop / N-turn memory</option>
<option value="embed">embed / rerank</option>
</select>
<label>Host</label>
<select id="host">
<option value="h100">H100 / H200</option>
<option value="5090">5090 / Pro 6000</option>
<option value="spark">DGX Spark UMA</option>
<option value="mini">Mac Mini 16GB</option>
</select>
<p class="note" id="routeCut"></p>
</div>
</section>
</main>
<script>
const $=function(id){return document.getElementById(id)};
function bill(){
  const rate=+$("box").value,n=+$("n").value,hrs=+$("hrs").value,tps=+$("tps").value,idle=+$("idle").value;
  const month=rate*n*hrs, useful=tps*(1-idle)*n*hrs*3600/1e6, unit=useful?month/useful:0, tax=month*idle;
  $("m-box").textContent="$"+month.toFixed(0);
  $("m-tok").textContent=useful.toFixed(0)+" M";
  $("m-unit").textContent="$"+unit.toFixed(2);
  $("m-idle").textContent="$"+tax.toFixed(0);
  $("billCut").textContent=idle>=0.3?("Idle tax $"+tax.toFixed(0)+"/mo. Cut ctx before another box."):("Unit $"+unit.toFixed(2)+" / M useful tok.");
}
function slo(){
  const target=+$("slo").value/100, mins=+$("min").value, down=+$("down").value;
  const budget=mins*(1-target), left=budget-down, avail=100*(1-down/mins);
  const miss=+$("ttft").value>+$("ttftb").value;
  $("eb").textContent=budget.toFixed(0);
  $("left").textContent=left.toFixed(0);
  $("left").className=left<0?"bad":"ok";
  $("av").textContent=avail.toFixed(3)+"%";
  $("tf").textContent=miss?"OVER":"inside";
  $("tf").className=miss?"bad":"ok";
  const burn=left<0||(+$("badp").value>=10&&miss);
  $("sloCut").textContent=burn?"Month is on fire. Freeze deploys. Cut ctx / conc, do not ship latest.":"Budget holds. tok/s is not this page.";
}
function route(){
  const k=$("kind").value,h=$("host").value;
  let t="";
  if(k==="infer"&&h==="mini")t="Mini is AGENT. 70B weights do not stand.";
  else if(k==="infer"&&h==="spark")t="Spark infers small/quant. 256K + util 0.80 is the loop. Cap ctx.";
  else if(k==="agent"&&(h==="h100"||h==="5090"))t="Agent on H100 wastes the FLOPS box. Put tools on Mini/CPU, infer on the GPU pool.";
  else if(k==="embed"&&h==="h100")t="Embed on H100 is a luxury. 5090 / CPU batch is the bill.";
  else t="Co-locate only if the host role matches the request. Split when agent steals decode.";
  $("routeCut").textContent=t;
}
function paint(){bill();slo();route()}
document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".tabs button").forEach(function(x){x.className=""});
    b.className="on";
    ["bill","slo","route"].forEach(function(t){$("p-"+t).className=b.dataset.t===t?"":"hide"});
  };
});
["box","n","hrs","tps","idle","slo","min","down","ttft","ttftb","badp","kind","host"].forEach(function(id){$(id).addEventListener("input",paint)});
paint();
</script></body></html>
