<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07080c"/>
<title>Pusula Ops</title>
<style>
:root{--bg:#07080c;--ink:#e8edf6;--dim:#8a93a6;--line:#262b38;--card:#10131a;--cyan:#6ee0ff;--ok:#5ee9b5;--bad:#ff6b81}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif}
header,main{max-width:860px;margin:0 auto;padding:16px}
.brand{font:700 13px ui-monospace,monospace;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}
.sub,.note{color:var(--dim);font-size:13px;line-height:1.5}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#141821;border-radius:8px;padding:7px 10px;font-size:12px}
.nav a.on{border-color:var(--cyan);color:var(--cyan)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs button{border:1px solid var(--line);background:#141821;color:var(--ink);border-radius:999px;padding:8px 12px}
.tabs button.on{border-color:var(--cyan);color:var(--cyan)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:8px 0 4px}
select,input{width:100%;background:#0b0e14;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi b{display:block;font-size:18px;margin-top:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left}th{color:var(--dim);font-size:11px}
</style></head><body>
<header>
<div class="brand">Pusula Ops</div>
<div class="nav"><a href="/">Serve</a><a class="on" href="/ops/">Ops</a></div>
<p class="sub">Serve = sığar mı. Ops = kutu API’yi döver mi, p99, insan bekliyor mu.</p>
<div class="tabs">
<button type="button" class="on" data-t="bill">Bill</button>
<button type="button" data-t="slo">SLO</button>
<button type="button" data-t="route">Route</button>
<button type="button" data-t="pay">Pay</button>
</div>
</header>
<main>
<section id="p-bill">
<div class="card">
<label>Box $/hr</label>
<select id="box">
<option value="2.5" selected>H100 spot ~$2.5/hr</option>
<option value="3.2">H100 on-demand ~$3.2/hr</option>
<option value="3.44">H200 droplet ~$3.44/hr</option>
<option value="0.7">RTX 5090 ~$0.7/hr</option>
<option value="1.1">Spark own ~$1.1/hr</option>
</select>
<div class="g">
<div><label>GPU count</label><input id="n" type="number" value="4" min="1"/></div>
<div><label>Hours / month</label><input id="hrs" type="number" value="720"/></div>
<div><label>Peak out tok/s / GPU</label><input id="tps" type="number" value="1600"/></div>
<div><label>Duty cycle 0–1</label><input id="util" type="number" value="0.40" step="0.05" min="0.05" max="1"/></div>
<div><label>API $/M out</label><input id="api" type="number" value="0.65" step="0.05"/></div>
</div>
<p class="note">Peak = doymuş batch çıktı tok/s, tek stream değil. 40% chat duty normal. 380 tok/s ile $0.65 API asla kırılmaz — o yüzden varsayılan 1600.</p>
</div>
<div class="card">
<div class="kpi">
<div><label>Box / month</label><b id="m-box">—</b></div>
<div><label>Effective $/M</label><b id="m-unit">—</b></div>
<div><label>vs API</label><b id="m-vs">—</b></div>
<div><label>Crossover util</label><b id="m-x">—</b></div>
</div>
<p class="note" id="billCut"></p>
<table><thead><tr><th>Util</th><th>$/M box</th><th>Winner</th></tr></thead><tbody id="board"></tbody></table>
</div>
</section>
<section id="p-slo" class="hide">
<div class="card">
<div class="g">
<div><label>Availability %</label><input id="slo" type="number" value="99.9" step="0.01"/></div>
<div><label>Month minutes</label><input id="min" type="number" value="43200"/></div>
<div><label>5xx minutes</label><input id="down" type="number" value="80"/></div>
<div><label>TTFT p99 ms</label><input id="ttft" type="number" value="2400"/></div>
<div><label>TTFT budget ms</label><input id="ttftb" type="number" value="800"/></div>
<div><label>ITL / TPOT ms</label><input id="itl" type="number" value="25"/></div>
<div><label>OSL tokens</label><input id="osl" type="number" value="256"/></div>
<div><label>Bad TTFT %</label><input id="badp" type="number" value="12"/></div>
</div>
</div>
<div class="card">
<div class="kpi">
<div><label>Budget left min</label><b id="left">—</b></div>
<div><label>Avail now</label><b id="av">—</b></div>
<div><label>E2E ms</label><b id="e2e">—</b></div>
<div><label>TTFT</label><b id="tf">—</b></div>
</div>
<p class="note" id="sloCut"></p>
</div>
</section>
<section id="p-route" class="hide">
<div class="card">
<label>Workload</label>
<select id="kind">
<option value="infer">70B / long ctx decode</option>
<option value="agent">agent N-turn + tools</option>
<option value="embed">embed / rerank / NER</option>
<option value="batch">overnight / 1000 docs</option>
</select>
<label>Host</label>
<select id="host">
<option value="h100">H100 / H200 dedicated</option>
<option value="5090">5090 / Pro 6000</option>
<option value="spark">DGX Spark UMA</option>
<option value="mini">Mac Mini / CPU</option>
<option value="api">managed API $/token</option>
</select>
<label>Small models on this GPU</label>
<select id="many">
<option value="1">1 model reserved</option>
<option value="n">many small, one process, LRU evict</option>
</select>
<p class="note" id="routeCut"></p>
</div>
</section>
<section id="p-pay" class="hide">
<div class="card">
<label>Is a human waiting?</label>
<select id="wait">
<option value="yes">yes — IDE / chat / TUI</option>
<option value="no">no — CI, nightly, 1000 docs</option>
<option value="mix">mix — interactive then offload</option>
</select>
<label>Router switches model mid-task?</label>
<select id="aff">
<option value="call">every call</option>
<option value="pin">pin per task / session</option>
</select>
<p class="note" id="payCut"></p>
</div>
</section>
</main>
<script>
const $=function(id){return document.getElementById(id)};
function cpm(rate,tps,u){return (rate/(tps*3600*u))*1e6}
function bill(){
  const rate=+$("box").value,n=+$("n").value,hrs=+$("hrs").value,tps=Math.max(1,+$("tps").value),u=Math.max(0.01,+$("util").value),api=Math.max(0.01,+$("api").value);
  const month=rate*n*hrs, unit=cpm(rate,tps,u), x=rate*1e6/(tps*3600*api), win=unit<api;
  $("m-box").textContent="$"+month.toFixed(0);
  $("m-unit").textContent="$"+unit.toFixed(2);
  $("m-vs").textContent=win?"BOX":"API";
  $("m-vs").className=win?"ok":"bad";
  $("m-x").textContent=x>1?"won't cross":((x*100).toFixed(0)+"%");
  $("billCut").textContent=x>1
    ?("This tok/s never beats $"+api.toFixed(2)+"/M. Raise peak tok/s or pick a cheaper box.")
    :(win?("Box wins at "+(u*100).toFixed(0)+"% duty. Crossover ~"+(x*100).toFixed(0)+"%."):("API wins until ~"+(x*100).toFixed(0)+"% duty."));
  $("board").innerHTML=[0.10,0.25,0.40,0.60,0.80].map(function(v){
    const c=cpm(rate,tps,v), w=c<api?"box":"api";
    return "<tr><td>"+(v*100).toFixed(0)+"%</td><td>$"+c.toFixed(2)+"</td><td class='"+(w==="box"?"ok":"bad")+"'>"+w+"</td></tr>";
  }).join("");
}
function slo(){
  const target=+$("slo").value/100, mins=+$("min").value, down=+$("down").value;
  const budget=mins*(1-target), left=budget-down, avail=100*(1-down/mins);
  const e2e=+$("ttft").value+Math.max(0,+$("osl").value-1)*+$("itl").value;
  const miss=+$("ttft").value>+$("ttftb").value;
  $("left").textContent=left.toFixed(0);
  $("left").className=left<0?"bad":"ok";
  $("av").textContent=avail.toFixed(3)+"%";
  $("e2e").textContent=e2e.toFixed(0);
  $("tf").textContent=miss?"OVER":"inside";
  $("tf").className=miss?"bad":"ok";
  const burn=left<0||(+$("badp").value>=10&&miss);
  $("sloCut").textContent=burn?"Budget burning. TTFT under load is queue. Shed conc.":("E2E ≈ TTFT + (OSL-1)×ITL = "+e2e.toFixed(0)+" ms.");
}
function route(){
  const k=$("kind").value,h=$("host").value,m=$("many").value;
  let t="";
  if(k==="batch"&&h==="api")t="Overnight on $/token is rush-hour pricing. Pay per hour.";
  else if(k==="infer"&&h==="mini")t="Mini is AGENT. 70B weights do not stand.";
  else if(k==="infer"&&h==="spark")t="Spark small/quant only. Cap ctx.";
  else if(k==="infer"&&h==="api")t="Bursty chat: API until Bill tab duty cycle crosses.";
  else if(k==="agent"&&(h==="h100"||h==="5090"))t="Agent on H100 steals decode. Pin model per task.";
  else if(k==="embed"&&h==="h100"&&m==="1")t="One embedder reserved 24/7 is the bill. Many small, one process.";
  else if(k==="embed"&&m==="n")t="encode/score/extract share one GPU.";
  else t="Host role must match the request.";
  $("routeCut").textContent=t;
}
function pay(){
  const w=$("wait").value,a=$("aff").value;
  let t=w==="yes"?"Human waiting → pay per token.":(w==="no"?"Nobody waiting → pay per hour.":"Interactive on token API, offload long job to GPU-hour.");
  t+=a==="call"?" Mid-task switch drops prefix cache.":" Affinity on.";
  $("payCut").textContent=t;
}
function paint(){bill();slo();route();pay()}
document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".tabs button").forEach(function(x){x.className=""});
    b.className="on";
    ["bill","slo","route","pay"].forEach(function(t){$("p-"+t).className=b.dataset.t===t?"":"hide"});
  };
});
["box","n","hrs","tps","util","api","slo","min","down","ttft","ttftb","itl","osl","badp","kind","host","many","wait","aff"].forEach(function(id){$(id).addEventListener("input",paint)});
paint();
</script></body></html>
