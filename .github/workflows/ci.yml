name: Pusula Pages CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: One app, one planner
        run: |
          test -f index.html
          test -f ops/index.html
          test -f about/index.html
          test -f pusula-serve/index.html
          test -f legal/index.html
          grep -q 'function pack(' index.html
          grep -q 'vram:32' index.html
          grep -q 'id="boot"' index.html
          grep -q 'href="#plan"' index.html
          grep -q 'location.replace' ops/index.html
          grep -q 'location.replace' pusula-serve/index.html
          grep -q 'location.replace' about/index.html
          ! grep -q 'Pusula Serve' index.html
          ! grep -q 'Pusula Ops' ops/index.html
          ! grep -q 'href="ops/"' index.html
